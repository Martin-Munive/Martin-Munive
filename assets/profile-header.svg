    <linearGradient id="signal" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5A4"/>
      <stop offset="0.42" stop-color="#22C55E"/>
      <stop offset="0.72" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#38BDF8"/>
