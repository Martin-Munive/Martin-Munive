<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Martín Munive profile header</title>
  <desc id="desc">Dark blue technological profile banner with red accents and Martín Munive as the main title.</desc>
  <defs>
    <linearGradient id="blueField" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.42" stop-color="#081A3A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 160) rotate(90) scale(210)">
      <stop offset="0" stop-color="#123C7A"/>
      <stop offset="0.55" stop-color="#0A1F44"/>
      <stop offset="1" stop-color="#050914"/>
    </radialGradient>
    <linearGradient id="redLine" x1="140" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="0.5" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redMarkShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#7F1D1D" flood-opacity="0.72"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#EF4444" flood-opacity="0.50"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#blueField)"/>
  <circle cx="600" cy="160" r="205" fill="url(#orb)" opacity="0.95"/>
  <circle cx="600" cy="160" r="224" stroke="#123C7A" stroke-width="3" opacity="0.65"/>
  <circle cx="600" cy="160" r="248" stroke="#1E3A8A" stroke-width="1" opacity="0.35"/>

  <g opacity="0.28">
    <path d="M0 88H1200" stroke="#1E3A8A"/>
    <path d="M0 232H1200" stroke="#1E3A8A"/>
    <path d="M160 0V320" stroke="#1E3A8A"/>
    <path d="M1040 0V320" stroke="#1E3A8A"/>
  </g>

  <path d="M110 224C258 188 356 209 480 226C645 249 764 225 907 184C982 162 1050 153 1120 160" stroke="url(#redLine)" stroke-width="3" stroke-linecap="round" opacity="0.42" filter="url(#softGlow)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M110 224C258 188 356 209 480 226C645 249 764 225 907 184C982 162 1050 153 1120 160;
              M110 210C250 232 362 218 500 190C648 160 770 176 916 212C992 230 1060 224 1120 198;
              M110 224C258 188 356 209 480 226C645 249 764 225 907 184C982 162 1050 153 1120 160"/>
  </path>

  <g filter="url(#redMarkShadow)" opacity="0.9">
    <path d="M438 258V62H492L600 188L708 62H762V258" stroke="#7F1D1D" stroke-width="62" stroke-linejoin="round" stroke-linecap="square"/>
    <path d="M438 258V62H492L600 188L708 62H762V258" stroke="#EF4444" stroke-width="34" stroke-linejoin="round" stroke-linecap="square"/>
    <path d="M438 258V62" stroke="#F87171" stroke-width="10" stroke-linecap="square" opacity="0.72"/>
    <path d="M762 62V258" stroke="#F87171" stroke-width="10" stroke-linecap="square" opacity="0.72"/>
  </g>

  <text x="600" y="136" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="52" font-weight="800">Martín Munive</text>
  <text x="600" y="181" text-anchor="middle" fill="#BFDBFE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="600">Medicine + Software + Data Systems</text>
  <text x="600" y="231" text-anchor="middle" fill="#FCA5A5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="500">clinical software · oncology data · bioinformatics · technical education</text>
</svg>
