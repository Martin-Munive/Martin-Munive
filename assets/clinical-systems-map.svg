<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
  <title id="title">Clinical systems constellation</title>
  <desc id="desc">Connected domains across medicine, biomedical data, research and learning systems.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1e3a4f"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
  </defs>

  <rect width="820" height="420" rx="12" fill="#0b1220"/>
  <rect x="1" y="1" width="818" height="418" rx="11" fill="none" stroke="#243244"/>
  <rect width="8" height="420" fill="url(#accent)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="28" y="36" fill="#e5edf7" font-size="20" font-weight="700">Clinical Systems Constellation</text>
    <text x="28" y="60" fill="#94a3b8" font-size="13">Connected work across care, evidence, research and learning</text>

    <g fill="none" stroke-linecap="round">
      <path d="M410 212L182 139L64 93" stroke="#ef4444" stroke-width="2" opacity="0.55"/>
      <path d="M182 139L66 198" stroke="#ef4444" stroke-width="2" opacity="0.55"/>
      <path d="M410 212L638 139L756 93" stroke="#38bdf8" stroke-width="2" opacity="0.55"/>
      <path d="M638 139L754 198" stroke="#38bdf8" stroke-width="2" opacity="0.55"/>
      <path d="M410 212L182 294L64 251" stroke="#22c55e" stroke-width="2" opacity="0.55"/>
      <path d="M182 294L66 356" stroke="#22c55e" stroke-width="2" opacity="0.55"/>
      <path d="M410 212L638 294L756 251" stroke="#f59e0b" stroke-width="2" opacity="0.55"/>
      <path d="M638 294L754 356" stroke="#f59e0b" stroke-width="2" opacity="0.55"/>
      <circle cx="410" cy="212" r="80" stroke="#243244" stroke-dasharray="3 8"/>
    </g>

    <g>
      <circle cx="410" cy="212" r="60" fill="url(#hub)" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="410" cy="212" r="5" fill="#e5edf7"/>
      <text x="410" y="195" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700">MARTIN MUNIVE</text>
      <text x="410" y="224" text-anchor="middle" fill="#e5edf7" font-size="17" font-weight="700">CLINICAL</text>
      <text x="410" y="243" text-anchor="middle" fill="#e5edf7" font-size="17" font-weight="700">SOFTWARE</text>
    </g>

    <g>
      <circle cx="182" cy="139" r="38" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="2"/>
      <circle cx="182" cy="139" r="4" fill="#ef4444"/>
      <text x="182" y="133" text-anchor="middle" fill="#e5edf7" font-size="12" font-weight="700">MEDICINE</text>
      <text x="182" y="153" text-anchor="middle" fill="#94a3b8" font-size="9">care logic</text>

      <circle cx="638" cy="139" r="38" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="638" cy="139" r="4" fill="#38bdf8"/>
      <text x="638" y="133" text-anchor="middle" fill="#e5edf7" font-size="12" font-weight="700">DATA</text>
      <text x="638" y="153" text-anchor="middle" fill="#94a3b8" font-size="9">traceable systems</text>

      <circle cx="182" cy="294" r="38" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="2"/>
      <circle cx="182" cy="294" r="4" fill="#22c55e"/>
      <text x="182" y="288" text-anchor="middle" fill="#e5edf7" font-size="12" font-weight="700">RESEARCH</text>
      <text x="182" y="308" text-anchor="middle" fill="#94a3b8" font-size="9">reproducible tools</text>

      <circle cx="638" cy="294" r="38" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="638" cy="294" r="4" fill="#f59e0b"/>
      <text x="638" y="288" text-anchor="middle" fill="#e5edf7" font-size="12" font-weight="700">LEARNING</text>
      <text x="638" y="308" text-anchor="middle" fill="#94a3b8" font-size="9">books + platforms</text>
    </g>

    <g font-size="11">
      <rect x="28" y="76" width="128" height="30" rx="4" fill="#111827" stroke="#5f2a34"/>
      <text x="92" y="95" text-anchor="middle" fill="#d8e1ec">Oncology workflows</text>
      <rect x="28" y="183" width="128" height="30" rx="4" fill="#111827" stroke="#5f2a34"/>
      <text x="92" y="202" text-anchor="middle" fill="#d8e1ec">Clinical reasoning</text>

      <rect x="664" y="76" width="128" height="30" rx="4" fill="#111827" stroke="#24566d"/>
      <text x="728" y="95" text-anchor="middle" fill="#d8e1ec">Retrieval systems</text>
      <rect x="664" y="183" width="128" height="30" rx="4" fill="#111827" stroke="#24566d"/>
      <text x="728" y="202" text-anchor="middle" fill="#d8e1ec">Regulatory data</text>

      <rect x="28" y="236" width="128" height="30" rx="4" fill="#111827" stroke="#23633a"/>
      <text x="92" y="255" text-anchor="middle" fill="#d8e1ec">Bioinformatics</text>
      <rect x="28" y="341" width="128" height="30" rx="4" fill="#111827" stroke="#23633a"/>
      <text x="92" y="360" text-anchor="middle" fill="#d8e1ec">Evidence pipelines</text>

      <rect x="664" y="236" width="128" height="30" rx="4" fill="#111827" stroke="#765314"/>
      <text x="728" y="255" text-anchor="middle" fill="#d8e1ec">Web books</text>
      <rect x="664" y="341" width="128" height="30" rx="4" fill="#111827" stroke="#765314"/>
      <text x="728" y="360" text-anchor="middle" fill="#d8e1ec">Medical education</text>
    </g>

    <text x="28" y="400" fill="#64748b" font-size="10">SYSTEM MAP / PUBLIC PORTFOLIO</text>
    <text x="792" y="400" text-anchor="end" fill="#64748b" font-size="10">CARE - DATA - EVIDENCE - LEARNING</text>
  </g>
</svg>
